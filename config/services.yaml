# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    socket_publish_url_default: 'http://127.0.0.1:3001/publish'
    uploads_directory: "%kernel.project_dir%/public/uploads/images"
    product_images_directory: "%kernel.project_dir%/public/uploads/products"
    customer_images_directory: "%kernel.project_dir%/public/uploads/customer/avatars"
    admin_images_directory: "%kernel.project_dir%/public/uploads/admin/avatars"
    staff_images_directory: "%kernel.project_dir%/public/uploads/staff/avatars"
    product_qr_directory: "%kernel.project_dir%/public/uploads/qrcodes"
    loyalty_points_per_currency: '%env(int:default:10:LOYALTY_POINTS_PER_CURRENCY)%'
    loyalty_min_order_for_redemption: '%env(float:default:100:LOYALTY_MIN_ORDER_FOR_REDEMPTION)%'
    loyalty_max_redemption_percentage: '%env(float:default:0.30:LOYALTY_MAX_REDEMPTION_PERCENTAGE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $adminEmail: '%env(ADMIN_EMAIL)%'
    app.remember_me_token_provider:
        class: Symfony\Component\Security\RememberMe\PersistentTokenBasedRememberMeServices

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"
        exclude:
            - "../src/EventSubscriber/DoctrineSubscriber.php"

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\CartService: ~

    App\Service\PayPalService:
        arguments:
            $clientId: '%env(PAYPAL_CLIENT_ID)%'
            $secret: '%env(PAYPAL_CLIENT_SECRET)%'
            $mode: '%env(PAYPAL_MODE)%'

    App\Service\SocketIoPublisher:
        arguments:
            $publishUrl: '%env(default:socket_publish_url_default:SOCKET_PUBLISH_URL)%'

    App\Service\RewardManager:
        arguments:
            $pointsPerCurrency: '%loyalty_points_per_currency%'
            $minOrderForRedemption: '%loyalty_min_order_for_redemption%'
            $maxRedemptionPercentage: '%loyalty_max_redemption_percentage%'

    App\Controller\Api\LoyaltyPolicyController:
        arguments:
            $loyaltyPointsPerCurrency: '%loyalty_points_per_currency%'
            $loyaltyMinOrderForRedemption: '%loyalty_min_order_for_redemption%'
            $loyaltyMaxRedemptionPercentage: '%loyalty_max_redemption_percentage%'

twig:
    default_path: "%kernel.project_dir%/templates"
    file_name_pattern: "*.twig"
