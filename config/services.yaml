# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    socket_public_url_default: 'https://web-socket-production-29ca.up.railway.app'
    socket_publish_url_default: 'https://web-socket-production-29ca.up.railway.app/publish'
    uploads_directory: "%kernel.project_dir%/public/uploads/images"
    product_images_directory: "%kernel.project_dir%/public/uploads/products"
    customer_images_directory: "%kernel.project_dir%/public/uploads/customer/avatars"
    admin_images_directory: "%kernel.project_dir%/public/uploads/admin/avatars"
    staff_images_directory: "%kernel.project_dir%/public/uploads/staff/avatars"
    product_qr_directory: "%kernel.project_dir%/public/uploads/qrcodes"
    loyalty_points_per_currency_default: 10
    loyalty_min_order_for_redemption_default: 100.0
    loyalty_max_redemption_percentage_default: 0.30
    loyalty_points_per_currency: '%env(int:default:loyalty_points_per_currency_default:LOYALTY_POINTS_PER_CURRENCY)%'
    loyalty_min_order_for_redemption: '%env(float:default:loyalty_min_order_for_redemption_default:LOYALTY_MIN_ORDER_FOR_REDEMPTION)%'
    loyalty_max_redemption_percentage: '%env(float:default:loyalty_max_redemption_percentage_default:LOYALTY_MAX_REDEMPTION_PERCENTAGE)%'
    paypal_client_id_default: ''
    paypal_client_secret_default: ''
    paypal_mode_default: 'sandbox'
    paypal.client_id: '%env(default:paypal_client_id_default:PAYPAL_CLIENT_ID)%'
    paypal.client_secret: '%env(default:paypal_client_secret_default:PAYPAL_CLIENT_SECRET)%'
    paypal.mode: '%env(default:paypal_mode_default:PAYPAL_MODE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $adminEmail: '%env(ADMIN_EMAIL)%'
    app.remember_me_token_provider:
        class: Symfony\Component\Security\RememberMe\PersistentTokenBasedRememberMeServices

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"
        exclude:
            - "../src/EventSubscriber/DoctrineSubscriber.php"

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\CartService: ~

    App\Service\PayPalService:
        arguments:
            $clientId: '%paypal.client_id%'
            $secret: '%paypal.client_secret%'
            $mode: '%paypal.mode%'

    App\Controller\Frontend\PayPalController:
        arguments:
            $paypalClientId: '%paypal.client_id%'
            $paypalMode: '%paypal.mode%'

    App\Service\SocketIoPublisher:
        arguments:
            $publishUrl: '%env(default:socket_publish_url_default:SOCKET_PUBLISH_URL)%'

    App\Service\RewardManager:
        arguments:
            $pointsPerCurrency: '%loyalty_points_per_currency%'
            $minOrderForRedemption: '%loyalty_min_order_for_redemption%'
            $maxRedemptionPercentage: '%loyalty_max_redemption_percentage%'

    App\Security\ApiLoginFailureHandler:
        arguments:
            $lexikFailureHandler: '@lexik_jwt_authentication.handler.authentication_failure'

    App\Service\GoogleIdTokenVerifier:
        arguments:
            $googleClientId: '%env(GOOGLE_CLIENT_ID)%'

    App\EventSubscriber\ApiRateLimitSubscriber:
        arguments:
            $authLoginLimiter: '@limiter.auth_login'
            $authRegisterLimiter: '@limiter.auth_register'
            $authPasswordResetLimiter: '@limiter.auth_password_reset'
            $authResendVerificationLimiter: '@limiter.auth_resend_verification'

twig:
    default_path: "%kernel.project_dir%/templates"
    file_name_pattern: "*.twig"
