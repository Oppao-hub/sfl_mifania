framework:
    rate_limiter:
        auth_login:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        auth_register:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        auth_password_reset:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        auth_resend_verification:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
