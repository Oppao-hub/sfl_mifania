services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: mifania_app
        restart: unless-stopped
        environment:
            DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.0.32&charset=utf8mb4"
        env_file:
            - .env
        ports:
            - "8000:80"
        volumes:
            - .:/app
        depends_on:
            - mysql
        networks:
            - mifania_network

    mysql:
        image: mysql:8.0
        container_name: mifania_db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - "${MYSQL_PORT}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - mifania_network

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: mifania_phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            PMA_USER: ${MYSQL_USER}
            PMA_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - "8080:80"
        depends_on:
            - mysql
        networks:
            - mifania_network

volumes:
    mysql_data:

networks:
    mifania_network:
        driver: bridge
